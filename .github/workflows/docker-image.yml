name: Docker Image CI

on:
  push:
    branches:
      - '**'
    tags:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag rtlib-docker-image
    - name: Build CI executables
      run: | 
        mkdir -p -v build
        docker run --rm --privileged -v ${PWD}:${PWD} -w=${PWD}/build rtlib-docker-image cmake -GNinja -DCMAKE_BUILD_TYPE=Release ..
        docker run --rm --privileged -v ${PWD}:${PWD} -w=${PWD}/build rtlib-docker-image cmake --build .
    - name: Run UTs
      run: ./build/ci/ut --gtest_output="xml:testresults.xml"
    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v1
      with:
        report_paths: 'testresults.xml'
        github_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Run performance tests
      run: ./build/ci/performance_tests_Os
    - name: Generate performace charts
      run: |
        mkdir -p -v reports

        for json_file in *_100.json *_1000.json *_10000.json; do
          if [ ! -f "$json_file" ]; then
            continue
          fi

          output_file="reports/${json_file%.json}.png"
          docker run --rm --privileged -v ${PWD}:${PWD} -w=${PWD} rtlib-docker-image \
            python3 ci/performance_tests/create_performance_chart.py --json "$json_file" --output "$output_file"
        done

    - name: Archive results
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports
        path: reports

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
    - name: Downlaod artifacts
      uses: actions/download-artifact@v4
      with:
        name: performance-reports
        path: performance-reports
    - name: Zip artifacts
      run: zip -r performance-reports.zip performance-reports
    - name: Get release
      id: get_release
      uses: bruceadams/get-release@v1.3.2
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Upload Release Asset
      id: upload-release-asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.get_release.outputs.upload_url }}
        asset_path: ./performance-reports.zip
        asset_name: performance-reports.zip
        asset_content_type: application/zip

